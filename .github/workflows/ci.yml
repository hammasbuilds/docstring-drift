name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock is committed; setup-uv errors outright when its default
          # **/uv.lock glob matches nothing. Key the cache on pyproject.toml.
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-groups
      - name: Lint
        run: |
          uv run ruff check src tests demo.py scripts
          uv run ruff format --check src tests demo.py scripts
      - name: Test
        # No network: every case is a hand-written source string parsed with ast.
        run: uv run pytest -q
      - name: Drift check (dogfood the CLI as a CI gate)
        # src/ is clean; this only passes because the exit code is real. A phantom
        # parameter here would make this step - and the build - fail.
        run: uv run python src/drift.py src
