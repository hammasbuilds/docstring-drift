[project]
name = "docstring-drift"
version = "0.1.0"
description = "Find docstrings that document parameters their function does not have. Pure AST, no imports, no execution."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Real extra, for `pip install -e ".[dev]"` (dependency-groups below are PEP 735,
# which plain pip does not install from - this keeps the pip-only path working too).
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[dependency-groups]
# Same list, for `uv sync --all-groups` (what CI uses).
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
